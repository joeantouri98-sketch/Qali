<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>$!TITLE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fcfcfb;--panel:#f3f2ef;--edge:#dedcd6;--ink:#161513;--ink2:#55534e;--muted:#7d7a73;--grid:#e8e6e1;
  --acc:#2a78d6;--fol:#e8710a;--quad:#6250d6;--cross:#c8261c;--dot:#c9c6bf;--hl:#fff3c4;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171716;--panel:#212120;--edge:#34332f;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8d86;--grid:#2b2a28;
  --acc:#3987e5;--fol:#f08a2d;--quad:#9085e9;--cross:#ee5d52;--dot:#4a4945;--hl:#4a4220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--panel:#212120;--edge:#34332f;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8d86;--grid:#2b2a28;
  --acc:#3987e5;--fol:#f08a2d;--quad:#9085e9;--cross:#ee5d52;--dot:#4a4945;--hl:#4a4220;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;margin:0;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:12px}
h1{font-size:21px;font-weight:600;margin:0}
.sub{color:var(--ink2);font-size:13px}
.hdr-btns{margin-left:auto;display:flex;gap:8px}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;align-items:start}
.app.closed{grid-template-columns:minmax(0,1fr)}.app.closed .rail{display:none}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.btn{background:transparent;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.seg{display:flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--ink2);border:0;padding:5px 2px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.checks label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px}
input[type=checkbox]{accent-color:var(--acc);margin:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.sl .top{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.sl .v{font-family:var(--mono);font-size:12px;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--ink2)}.kv span:nth-child(even){font-family:var(--mono);font-size:12px;text-align:right}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.plot{border:1px solid var(--edge);border-radius:8px;overflow:hidden}
#plot{width:100%;height:640px}
.note{color:var(--ink2);font-size:12.5px;line-height:1.5;margin:0;padding-left:18px}
.card{border:1px solid var(--edge);border-radius:8px;padding:10px 12px}
.card b{font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:6px}
th,td{text-align:left;padding:3px 12px 3px 0;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11.5px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel)}tr.sel td{background:var(--hl)}
.tw{max-height:260px;overflow:auto}
@media print{header,.rail{display:none!important}.app{display:block}}
</style></head><body>
<header>
  <h1 id="h1"></h1><span class="sub" id="sub"></span>
  <div class="hdr-btns">
    <button class="btn" id="csv">Data CSV</button>
    <button class="btn" id="railbtn" aria-expanded="true">Hide controls</button>
    <button class="btn" id="theme">Theme: auto</button>
  </div>
</header>
<div class="app" id="app">
  <aside class="rail" aria-label="Controls">
    <section><h2>State</h2><div class="kv" id="state"></div></section>
    <section><h2>Polarisability</h2><div class="kv" id="pol"></div></section>
    <section><h2>Show</h2>
      <div class="checks">
        <label><input type="checkbox" id="c-fol" checked>Followed state</label>
        <label><input type="checkbox" id="c-quad" checked><span id="qlab">−½αF²</span></label>
        <label><input type="checkbox" id="c-x" checked>Avoided crossings</label>
        <label><input type="checkbox" id="c-grey">Grey dots</label>
      </div>
      <div class="sl" style="margin-top:8px"><div class="top"><span>Hide character below</span><span class="v" id="minv"></span></div>
        <input type="range" id="minc" min="0" max="0.5" step="0.005" value="0"></div>
    </section>
    <section><h2>Energy</h2>
      <div class="seg" id="unit"><button data-u="GHz" aria-pressed="true">GHz</button><button data-u="MHz">MHz</button><button data-u="cm">cm⁻¹</button></div>
      <div class="seg" id="cmap" style="margin-top:6px"><button data-c="blue" aria-pressed="true">Blue</button><button data-c="red">Red</button><button data-c="viridis">Viridis</button></div>
      <div class="seg" id="zero" style="margin-top:6px"><button data-z="state" aria-pressed="true">Zero at the state</button><button data-z="limit">At the limit</button></div>
    </section>
    <section><h2>Field cursor</h2>
      <div class="sl"><div class="top"><span id="flab">F</span><span class="v" id="fv"></span></div>
        <input type="range" id="fcur" min="0" step="1" value="0"></div>
      <div class="kv" id="atf" style="margin-top:6px"></div>
    </section>
  </aside>
  <main class="main">
    <div class="plot"><div id="plot"></div></div>
    <ul class="note" id="notes"></ul>
    <div class="card"><b>Avoided crossings of the followed state</b>
      <div class="tw"><table><thead><tr><th>F (V/cm)</th><th>gap</th><th>F / F_IT</th></tr></thead><tbody id="xt"></tbody></table></div>
    </div>
    <div class="card"><b>Field-free levels in the window</b>
      <div class="tw"><table><thead><tr><th>level</th><th>E − E_state</th><th>energy from</th></tr></thead><tbody id="lt"></tbody></table></div>
    </div>
  </main>
</div>
<script>
const D=$!DATA_JS;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const S={unit:'GHz',theme:'auto',k:0,zero:'state',cmap:'blue'};
const CMAPS={blue:()=>[[0,css('--dot')],[0.15,css('--dot')],[1,css('--acc')]],red:()=>[[0,css('--dot')],[0.08,css('--dot')],[0.4,'#f26b6b'],[0.75,'#d40000'],[1,'#3a0000']],
  viridis:()=>'Viridis'};
const GL=(()=>{try{const c=document.createElement('canvas');return !!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){return false}})();   // SVG without WebGL
const UF={GHz:[1,'GHz'],MHz:[1e3,'MHz'],cm:[1/29.9792458,'cm⁻¹']};
const ef=v=>v*UF[S.unit][0];
const ez=v=>(v+(S.zero==='limit'?-D.binding_cm*29.9792458:0))*UF[S.unit][0];   // plotted energy
const g=x=>{if(!isFinite(x))return '–';const a=Math.abs(x);return a!==0&&(a<1e-3||a>=1e6)?x.toExponential(4):(+x.toPrecision(6)).toString()};
const lab=s=>esc(s).replace(/(\d+\/2)$/,'<sub>$1</sub>');
const F=D.fields_V_cm, N=F.length;
const AC=D.mode==='ac'&&D.ac?D.ac:null;               // AC (Floquet) map: F is the peak amplitude
const QL=AC?(AC.dc_V_cm?'second order':'−¼α(ω)F²'):'−½αF²';
const QY=D.quadratic_ghz||F.map(f=>-0.5*(D.polarizability.by_mj[fr(Math.abs(D.mj)).replace('−','')]??D.polarizability.alpha0)*f*f/1e3);
const CBT=(()=>{const m=/^(\d+)([a-z])(\d+\/2)$/.exec(D.state);return m?`|⟨${m[1]}${m[2].toUpperCase()}<sub>${m[3]}</sub>|μ⟩|²`:`|⟨${esc(D.state)}|μ⟩|²`})();   // the state's share of each level
// followed state: drawn while one level holds at least half of it, and broken where it jumps to another level
const FOL=(()=>{const y=D.followed_ghz.map((v,k)=>Math.max(0,...D.character[k])>=0.5?v:null);
  const d=[];for(let k=1;k<N;k++)if(y[k]!=null&&y[k-1]!=null)d.push(Math.abs(y[k]-y[k-1]));d.sort((a,b)=>a-b);
  if(d.length>3){const lim=5*d[Math.floor(0.75*(d.length-1))]+1e-9;for(let k=N-1;k>0;k--)if(y[k]!=null&&y[k-1]!=null&&Math.abs(y[k]-y[k-1])>lim)y[k]=null}
  return y})();
function header(){
  $('h1').innerHTML=`${esc(D.label||D.element)} ${lab(D.state)}, m<sub>j</sub> = ${fr(D.mj)}`;
  $('sub').textContent=(AC?`AC Stark map at ${g(AC.frequency_ghz)} GHz: ${D.basis.size} states × ${2*AC.sidebands+1} photon blocks`
    :`Stark map: ${D.basis.size} states`)+`, n ${D.basis.n_lo}–${D.basis.n_hi}, l ≤ ${D.basis.l_max}`;
  const st=[['n*',D.n_star.toFixed(5)],['binding',D.binding_cm.toFixed(4)+' cm⁻¹'],['energy from',D.energy_source],
    ['E_I',D.ionization_cm.toFixed(4)+' cm⁻¹'],['Inglis–Teller F',g(D.inglis_teller_V_cm)+' V/cm']];
  if(AC)st.push(['AC frequency',g(AC.frequency_ghz)+' GHz'],['sidebands','±'+AC.sidebands],['static field',g(AC.dc_V_cm)+' V/cm']);
  $('state').innerHTML=st.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');
  const P=D.polarizability,rows=[['α0',g(P.alpha0)+' MHz/(V/cm)²'],['α0',g(P.alpha0_au)+' a.u.']];
  if(D.j>0.5){rows.push(['α2',g(P.alpha2)+' MHz/(V/cm)²'],['α2',g(P.alpha2_au)+' a.u.'])}
  if(AC){const A=AC.alpha_dynamic;rows.push(['α0(ω)',g(A.alpha0)+' MHz/(V/cm)²'],['α0(ω)',g(A.alpha0_au)+' a.u.']);
    if(D.j>0.5)rows.push(['α2(ω)',g(A.alpha2)+' MHz/(V/cm)²'])}
  for(const [m,a] of Object.entries(P.by_mj))rows.push(['α(|m_j| = '+m+')',g(a)]);
  $('pol').innerHTML=rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');
}
function fr(x){const a=Math.round(2*x);return (a<0?'−':'')+Math.abs(a)+'/2'}
function curPoints(){const mc=+$('minc').value,xs=[],ys=[],cs=[];
  for(let k=0;k<N;k++){const E=D.energies_ghz[k],C=D.character[k];for(let i=0;i<E.length;i++){if(C[i]<mc)continue;xs.push(F[k]);ys.push(ez(E[i]));cs.push(C[i])}}
  const o=cs.map((_,i)=>i).sort((a,b)=>cs[a]-cs[b]);
  return [o.map(i=>xs[i]),o.map(i=>ys[i]),o.map(i=>cs[i])]}
function draw(){
  const ink=css('--ink'),ink2=css('--ink2'),grid=css('--grid'),bg=css('--bg');
  const [xs,ys,cs]=curPoints(),grey=$('c-grey').checked;
  const tr=[{type:GL?'scattergl':'scatter',mode:'markers',x:xs,y:ys,name:'eigenstates',hovertemplate:(AC?'F_ac':'F')+' %{x:.4g} V/cm<br>E %{y:.6g} '+UF[S.unit][1]+'<br>'+CBT+' %{marker.color:.3f}<extra></extra>',
    marker:{size:3.2,color:grey?cs.map(()=>0):cs,cmin:0,cmax:1,colorscale:CMAPS[S.cmap](),reversescale:S.cmap==='viridis',
      showscale:!grey,colorbar:{title:{text:CBT,font:{size:11,color:ink2}},thickness:10,len:0.6,tickfont:{size:10,color:ink2}}}}];
  if($('c-fol').checked)tr.push({type:'scatter',mode:'lines',x:F,y:FOL.map(v=>v==null?null:ez(v)),connectgaps:false,name:'followed',line:{color:css('--fol'),width:1.4},hoverinfo:'skip'});
  if($('c-quad').checked){
    tr.push({type:'scatter',mode:'lines',x:F,y:QY.map(v=>ez(v)),name:QL,line:{color:css('--quad'),width:1.2,dash:'dash'},hoverinfo:'skip'})}
  if($('c-x').checked&&D.crossings.length){const xi=D.crossings.map(c=>c.field_V_cm);
    tr.push({type:'scatter',mode:'markers',x:xi,y:xi.map(f=>ez(interp(f))),name:'avoided crossing',marker:{symbol:'x-thin-open',size:9,color:css('--cross'),line:{width:1.6,color:css('--cross')}},
      hovertemplate:'crossing %{x:.5g} V/cm<extra></extra>'})}
  const f0=F[S.k];
  const L={paper_bgcolor:bg,plot_bgcolor:bg,font:{family:css('--sans'),color:ink},margin:{l:72,r:20,t:14,b:48},hovermode:'closest',
    xaxis:{title:{text:AC?'F<sub>ac</sub> (V/cm, peak)':'F (V/cm)',font:{color:ink2,size:12}},gridcolor:grid,zerolinecolor:grid,tickfont:{color:ink2,size:11},ticks:'outside',tickcolor:ink2,linecolor:ink2},
    yaxis:{title:{text:(S.zero==='limit'?'E below the limit (':'E − E('+D.state+') (')+UF[S.unit][1]+')',font:{color:ink2,size:12}},gridcolor:grid,zerolinecolor:grid,tickfont:{color:ink2,size:11},ticks:'outside',tickcolor:ink2,linecolor:ink2,tickformat:'~g'},
    legend:{orientation:'h',x:0,y:1.05,font:{size:12,color:ink2}},
    shapes:[{type:'line',x0:f0,x1:f0,yref:'paper',y0:0,y1:1,line:{color:ink2,width:1,dash:'dot'}}]};
  return Plotly.react('plot',tr,L,{displaylogo:false,responsive:true,modeBarButtonsToRemove:['lasso2d','select2d']});
}
function interp(f){let k=0;while(k<N-1&&F[k+1]<f)k++;if(k>=N-1)return D.followed_ghz[N-1];const t=(f-F[k])/(F[k+1]-F[k]);return D.followed_ghz[k]*(1-t)+D.followed_ghz[k+1]*t}
function atField(){const k=S.k,E=D.energies_ghz[k],C=D.character[k];$('fv').textContent=g(F[k])+' V/cm';
  let im=0;C.forEach((c,i)=>{if(c>C[im])im=i});
  let gap=Infinity;E.forEach((e,i)=>{if(i!==im)gap=Math.min(gap,Math.abs(e-E[im]))});
  $('atf').innerHTML=[['shift',g(ef(E[im]))+' '+UF[S.unit][1]],[QL,g(ef(QY[k]))+' '+UF[S.unit][1]],[CBT,C[im].toFixed(4)],
    ['nearest other',g(ef(gap))+' '+UF[S.unit][1]],['F / F_IT',(F[k]/D.inglis_teller_V_cm).toFixed(3)]].map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('')}
function tables(){
  $('xt').innerHTML=D.crossings.length?D.crossings.map((c,i)=>`<tr data-f="${c.field_V_cm}"><td>${g(c.field_V_cm)}</td><td>${g(c.gap_MHz)} MHz</td><td>${(c.field_V_cm/D.inglis_teller_V_cm).toFixed(3)}</td></tr>`).join('')
    :'<tr><td colspan="3">none in this field range</td></tr>';
  document.querySelectorAll('#xt tr[data-f]').forEach(r=>r.onclick=()=>{const f=+r.dataset.f;let k=0,b=Infinity;F.forEach((x,i)=>{if(Math.abs(x-f)<b){b=Math.abs(x-f);k=i}});S.k=k;$('fcur').value=k;atField();draw();
    document.querySelectorAll('#xt tr').forEach(x=>x.classList.toggle('sel',x===r))});
  $('lt').innerHTML=D.levels_in_window.slice().sort((a,b)=>a.E_ghz-b.E_ghz).map(l=>`<tr><td>${lab(l.label)}</td><td>${g(ef(l.E_ghz))} ${UF[S.unit][1]}</td><td>${esc(l.source)}</td></tr>`).join('')}
function notes(){const n=AC?[`Each dot is a quasienergy of Shirley's Floquet Hamiltonian for F(t) = F_dc + F_ac cos(2πft) at one m_j.`,
  `Colour: |⟨state|μ⟩|², the share of ${D.state} with no photons added in each dressed state μ.`,
  `Quasienergies repeat every ${g(AC.frequency_ghz)} GHz: copies of each level sit at multiples of f.`,
  `Photon blocks q = −${AC.sidebands}…${AC.sidebands}; processes of up to ${AC.sidebands+1} photons are converged.`]
  :[`Each dot is an eigenstate of H0 + F z at one m_j; colour: |⟨state|μ⟩|², the share of ${D.state} in each eigenstate μ.`];
  if(AC&&AC.sideband_check)n.push(`One more sideband moves ${D.state} by ${g(AC.sideband_check.change_MHz)} MHz at ${g(AC.sideband_check.amplitude_V_cm)} V/cm.`);
  n.push(
  `Basis: n ${D.basis.n_lo}–${D.basis.n_hi}, every l up to ${D.basis.l_max}, both j: ${D.basis.size} states.`,
  `Energies: precision quantum defects (j-resolved), NIST levels at low n; radial integrals in the Marinescu model potential.`,
  `Shown: eigenvalues within ±${g(D.window_ghz)} GHz of the field-free level.`,
  AC?`Polarisability from second-order perturbation in the same basis; AC shift −¼α(ω)F_ac², F_ac the peak amplitude.`
    :`Polarisability from second-order perturbation in the same basis, ΔE = −½αF².`,
  `Avoided crossings: local minima of the gap between the followed state and its nearest neighbour.`,
  `Followed state: the level holding most of the state, drawn while it holds at least half.`);
  if(D.dissolved_V_cm!=null)n.push(`Above ${g(D.dissolved_V_cm)} V/cm no level holds half of ${D.state}: no crossings are listed past it.`);
  $('notes').innerHTML=n.map(t=>`<li>${esc(t)}</li>`).join('')}
function csv(){const rows=[(AC?'ac_amplitude_V_cm':'field_V_cm')+',energy_GHz,character'];for(let k=0;k<N;k++)D.energies_ghz[k].forEach((e,i)=>rows.push(`${F[k]},${e},${D.character[k][i]}`));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download=`${D.element}_${D.state.replace('/','-')}_stark.csv`;a.click()}
$('fcur').max=N-1;$('fcur').oninput=e=>{S.k=+e.target.value;atField();draw()};
$('minc').oninput=()=>{$('minv').textContent=(+$('minc').value).toFixed(3);draw()};
['c-fol','c-quad','c-x','c-grey'].forEach(i=>$(i).onchange=draw);
document.querySelectorAll('#cmap button').forEach(b=>b.onclick=()=>{S.cmap=b.dataset.c;document.querySelectorAll('#cmap button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
document.querySelectorAll('#zero button').forEach(b=>b.onclick=()=>{S.zero=b.dataset.z;document.querySelectorAll('#zero button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
document.querySelectorAll('#unit button').forEach(b=>b.onclick=()=>{S.unit=b.dataset.u;document.querySelectorAll('#unit button').forEach(x=>x.setAttribute('aria-pressed',x===b));tables();atField();draw()});
$('railbtn').onclick=()=>{const c=$('app').classList.toggle('closed');$('railbtn').textContent=c?'Show controls':'Hide controls';$('railbtn').setAttribute('aria-expanded',!c);setTimeout(()=>Plotly.Plots.resize('plot'),50)};
$('theme').onclick=()=>{const o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme)+1)%3];const h=document.documentElement;S.theme==='auto'?h.removeAttribute('data-theme'):h.setAttribute('data-theme',S.theme);$('theme').textContent='Theme: '+S.theme;draw()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')draw()});
$('csv').onclick=csv;
$('minv').textContent='0.000';$('qlab').textContent=QL;if(AC)$('flab').textContent='F_ac';
header();notes();tables();atField();draw();
</script>
</body></html>
